server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — any unknown path falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend service inside the docker network
  location /api/ {
    proxy_pass http://backend:8030/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Long cache for static assets, short cache for index.html
  location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
